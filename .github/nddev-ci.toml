schema = 1
profiles = ["typescript-javascript"]

[commands.typescript-javascript]
toolchain = ["bun", "--version"]
format = ["bun", "x", "biome", "format", "src", "scripts", "vite.config.ts"]
lint = ["bun", "run", "lint"]
type = ["just", "check"]
test = ["just", "test"]
build = ["just", "build"]

[not_applicable.typescript-javascript]
package = "Immutable app-shell artifact; it ships through owned releases and never publishes to a registry"

[reports.typescript-javascript]
kind = "junit"
path = ".nddev-reports/web.xml"

[timeouts]
typescript-javascript = 2400
