name: NDS checks

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@1a409d4ee632eb594e58a6b291ce9e5a0ef51da2 # v0.6.37
    with:
      timeout-minutes: 45
      setup: true
      node-version: '26.13.0'
      python-version: '3.15.2'
      bun-version: '1.4.4'
      rust-version: '1.99.1'
      rust-components: rustfmt,clippy
      rust-targets: wasm32-unknown-unknown
      tool-assets: .github/native-tools.json
