name: main-ci

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      bindings:
        description: Generate both actual Rust/WASM declaration profiles for source preparation
        type: boolean
        default: false

permissions: {}

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@9fead1382c452a6b791a0a9e464ac6ac66537ac3 # v0.6.51
    with:
      timeout-minutes: 45
      setup: true
      node-version: '26.13.0'
      python-version: '3.15.2'
      bun-version: '1.4.4'
      rust-version: '1.99.1'
      rust-components: rustfmt,clippy
      rust-targets: wasm32-unknown-unknown
      tool-assets: .github/native-tools.json

  artifact:
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    if: ${{ !cancelled() && (needs.contract.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.bindings)) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    needs: [contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - name: Prepare the exact native tool assets
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9fead1382c452a6b791a0a9e464ac6ac66537ac3 # v0.6.51
        with:
          manifest: .github/native-tools.json
          directory: ${{ runner.temp }}/web-native-tools
          add-to-path: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
        if: ${{ !inputs.bindings }}
      - run: python3 scripts/check-artifact.py build/react
        if: ${{ !inputs.bindings }}
      - name: Generate actual production WASM declarations
        if: ${{ inputs.bindings }}
        run: bun run build --bindings-only
      - name: Generate actual development WASM declarations
        if: ${{ inputs.bindings }}
        run: bun run build --bindings-only --development-http
      - name: Retain generated source inputs
        if: ${{ inputs.bindings }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-source-bindings-${{ github.sha }}
          path: .build/source-bindings/
          if-no-files-found: error
          retention-days: 7
